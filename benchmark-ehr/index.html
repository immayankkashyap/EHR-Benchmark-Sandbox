<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benchmark General Hospital · EHR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#182b3b;font:15px system-ui,sans-serif}header{background:#153b4b;color:white;padding:22px 30px;display:flex;justify-content:space-between;gap:20px;align-items:center}header strong{font-size:21px}header small{display:block;color:#b9d7df;margin-top:5px}.badge{background:#dceee9;color:#215a4c;padding:7px 12px;border-radius:20px;font-size:12px}main{display:grid;grid-template-columns:290px 1fr;max-width:1500px;margin:auto;min-height:85vh}aside{padding:24px 18px;border-right:1px solid #d6e0e7}input{width:100%;padding:12px;border:1px solid #b6c8d3;border-radius:8px;font:inherit}#patients{max-height:72vh;overflow:auto;margin-top:15px}button{display:block;text-align:left;width:100%;padding:13px;background:white;border:1px solid #dce5eb;border-radius:7px;margin:6px 0;color:inherit;cursor:pointer}button:hover,button[aria-current=true]{background:#e1eff2;border-color:#398396}button small{display:block;color:#617780;margin-top:3px}article{padding:30px;min-width:0}h1{margin:0 0 7px;font-size:27px}h2{font-size:17px;margin:0 0 16px}.muted{color:#607582;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0}.card,section{background:white;border:1px solid #dce5eb;border-radius:10px;padding:20px}.card span{display:block;font-size:12px;color:#627986;margin-bottom:7px}.notice{padding:13px 17px;background:#e9f2f4;border-radius:7px;line-height:1.5;margin-bottom:22px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.75 system-ui,sans-serif;margin:0}#status{padding-top:12px}details{margin-top:22px}summary{cursor:pointer}details pre{font:12px/1.5 monospace;margin-top:12px}.empty{padding:60px 0;color:#607582}@media(max-width:800px){main{grid-template-columns:1fr}aside{border-right:0}#patients{max-height:220px}article{padding:20px}.grid{grid-template-columns:1fr}header{padding:20px;align-items:flex-start}}
</style>
<header><div><strong>Benchmark General Hospital</strong><small>Electronic health record · Synthetic research environment</small></div><span class="badge">Question-only benchmark</span></header>
<main><aside><h2>Patient directory</h2><label for="search" class="muted">Find by patient ID or question number</label><input id="search" placeholder="e.g. MXQ-0001" autocomplete="off"><div id="status" class="muted" role="status">Connecting to EHR…</div><nav id="patients" aria-label="Patients"></nav></aside><article id="chart"><div class="empty">Select a patient to open their chart.</div></article></main>
<script>
let patients=[],selected='',requestNumber=0;
const el=id=>document.getElementById(id);
async function get(url){const r=await fetch(url);const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}
function renderList(){const query=el('search').value.toLowerCase().trim();const filtered=patients.filter(p=>p.id.includes(query)||p.name[0].text.toLowerCase().includes(query)||String(Number(p.id.slice(4)))===query);el('patients').replaceChildren();for(const p of filtered){const b=document.createElement('button');b.type='button';b.setAttribute('aria-current',p.id===selected);b.textContent=p.id.toUpperCase();const sub=document.createElement('small');sub.textContent=p.name[0].text;b.append(sub);b.onclick=()=>openChart(p.id);el('patients').append(b)}el('status').textContent=`${filtered.length} of ${patients.length} patients`}
async function openChart(id){selected=id;renderList();const current=++requestNumber;el('chart').textContent='Loading chart…';try{const d=await get('/api/chart/'+id);if(current!==requestNumber)return;el('chart').innerHTML='<h1 id="name"></h1><div class="muted" id="mrn"></div><div class="grid"><div class="card"><span>Visit date · synthetic</span><strong id="visit"></strong></div><div class="card"><span>Attending doctor · synthetic</span><strong id="doctor"></strong></div><div class="card"><span>Diagnosis</span><strong>Withheld for benchmark</strong></div></div><div class="notice">Patient identity, doctor, hospital and visit date are synthetic administrative details. Clinical details are preserved in the original question below. No answer key or inferred diagnosis is recorded.</div><section><h2>Original question / clinical note</h2><div class="muted" style="margin-bottom:16px">Original wording and both supplied choice lists retained. No option is marked as correct.</div><pre id="note"></pre></section><details><summary>View stored FHIR resources</summary><pre id="raw"></pre></details>';el('name').textContent=d.Patient.name[0].text;el('mrn').textContent='Patient ID: '+id.toUpperCase()+' · Visit: '+d.Encounter.id;el('visit').textContent=d.Encounter.period.start.slice(0,10);el('doctor').textContent=d.Practitioner.name[0].text;el('note').textContent=new TextDecoder().decode(Uint8Array.from(atob(d.DocumentReference.content[0].attachment.data),c=>c.charCodeAt(0)));el('raw').textContent=JSON.stringify(d,null,2);history.replaceState(null,'','#'+id)}catch(e){if(current===requestNumber)el('chart').textContent=e.message}}
el('search').addEventListener('input',renderList);get('/api/patients').then(data=>{patients=data;renderList();const id=location.hash.slice(1);if(patients.some(p=>p.id===id))openChart(id);else if(patients.length)openChart(patients[0].id)}).catch(e=>el('status').textContent=e.message);
</script></html>
