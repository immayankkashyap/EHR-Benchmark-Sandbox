# Squid Egress Proxy Configuration
# Purpose: Enforce strict outbound domain allowlisting for LLM API traffic (.openai.com, .anthropic.com)
# while blocking all other outbound network connections from the benchmark sandbox environment.

# Set proxy listening port
http_port 3128

# Define Access Control Lists (ACLs) for allowed destination domains
# The leading dot matches the domain and all its subdomains (e.g., api.openai.com, openai.com)
acl allowed_llm_domains dstdomain .openai.com .anthropic.com

# Define standard SSL / CONNECT ports for HTTPS tunneling
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Deny access to non-safe ports
http_access deny !Safe_ports

# Deny CONNECT requests to non-SSL ports
http_access deny CONNECT !SSL_ports

# Allow access to explicit LLM API domains
http_access allow allowed_llm_domains

# Explicitly deny all other outbound HTTP/HTTPS proxy requests
http_access deny all

# Disable Squid disk caching for ephemeral benchmark operations
cache deny all
