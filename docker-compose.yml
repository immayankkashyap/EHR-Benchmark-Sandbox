services:
  ehr-viewer:
    build: ./benchmark-ehr
    volumes:
      - ./benchmark-ehr/generated:/data:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    restart: unless-stopped
    networks: [ehr_readonly]

networks:
  ehr_readonly:
    internal: true
    driver: bridge
